<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ビートスラッシュ - 音を斬れ</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<script src="common.js"></script>
<script>
'use strict';
const { TAU, clamp, rand } = RG;
// fb / fh: 的のない拍 / 裏拍を埋める盛り上がりの下限 (大きいほど埋めない)
const DIFF = {
  easy:   { mult: 1.7,  gap: 0.55, size: 1.12, fb: 0.55, fh: 9,   diag: 0,    dot: 0.25 },
  normal: { mult: 1.45, gap: 0.33, size: 1,    fb: 0.25, fh: 9,   diag: 0.25, dot: 0.06 },
  hard:   { mult: 1.25, gap: 0.22, size: 0.94, fb: 0.2,  fh: 0.6, diag: 0.4,  dot: 0.03 },
};
const HUES = [350, 275, 160, 200];      // 音の高さごとのクリスタルの色
const APP = 1.25;                       // 奥に現れてから手前の「斬る面」に届くまでの秒数
const WIN = { crit: 0.09, good: 0.17, early: 0.26, late: 0.2 };
// 斬る向き (画面上の dx, dy)。0 下 1 上 2 左 3 右 4 左下 5 右下 6 左上 7 右上
const DIRS = [[0, 1], [0, -1], [-1, 0], [1, 0], [-0.7071, 0.7071], [0.7071, 0.7071], [-0.7071, -0.7071], [0.7071, -0.7071]];
const OPP = [1, 0, 3, 2, 7, 6, 5, 4], NEAR = [[4, 5], [6, 7], [4, 6], [5, 7], [0, 2], [0, 3], [1, 2], [1, 3]];
const KIND = { crit: { color: '#ffe08a', w: 1 }, good: { color: '#9ff0c8', w: 0.7 }, ok: { color: '#9cc4ff', w: 0.35 } };
const fx = new RG.Fx();
let notes = [], head = 0, J = null, trail = [], halves = [], slashes = [], pops = [];
let zoom = 0, counts = {}, L = { cols: 4, cell: 100, cx: 0, cy: 0, vx: 0, vy: 0 }, per = 0.5, beat0 = 0;

/* ---- 譜面: 音の立ち上がり + 拍の穴埋め → 斬る時刻の並び ---- */
function timeline(feat, diff) {
  const D = DIFF[diff], B = RG.beats(feat);
  const list = RG.onsets(feat, D).map(n => ({ t: n.t, type: n.type, big: n.big }));
  if (list.length > 4) {
    const ts = list.map(n => n.t);
    const free = (t, w) => {
      let lo = 0, hi = ts.length - 1;
      while (lo < hi) { const m = (lo + hi) >> 1; if (ts[m] < t - w) lo = m + 1; else hi = m; }
      return !(ts[lo] >= t - w && ts[lo] <= t + w);
    };
    const add = (t, thr) => { if (t > ts[0] && t < ts[ts.length - 1] && RG.intensity(feat, t) >= thr) list.push({ t, type: 3, big: false }); };
    for (let k = 0; k < B.beats.length; k++) {
      const b = B.beats[k], p = k + 1 < B.beats.length ? B.beats[k + 1] - b : B.period;
      if (free(b, p * 0.3)) add(b, D.fb);
      if (p / 2 >= 0.2 && free(b + p / 2, p * 0.22)) add(b + p / 2, D.fh);
    }
    list.sort((a, b) => a.t - b.t);
  }
  return list;
}
/* ---- 斬る向きと位置: 振り下ろしたら次は振り上げる、と手が自然に往復する並びにする ---- */
function build(api) {
  const feat = api.song.feat, D = DIFF[api.diff], rng = RG.rng(feat.seed + api.diff.length * 131);
  const list = timeline(feat, api.diff), cols = L.cols;
  let col = cols >> 1, row = 1, pd = 1, prevT = -10;
  for (const n of list) {
    const gap = n.t - prevT, [px, py] = DIRS[pd];
    if (gap > per * 2.6) {                      // 間があいたら仕切り直し
      col = Math.floor(rng() * cols); row = 1; pd = rng() < 0.7 ? 1 : (rng() < 0.5 ? 2 : 3);
    } else {                                    // 前の一振りが抜けた先あたりに次の的を置く
      col = clamp(col + Math.round(px) + (rng() < 0.3 ? (rng() < 0.5 ? -1 : 1) : 0), 0, cols - 1);
      row = clamp(row + Math.round(py), 0, 2);
    }
    if (n.big || rng() < D.dot) n.dir = -1;      // どの向きでも斬れる的
    else {
      let d = OPP[pd];
      if (rng() < D.diag) d = NEAR[d][rng() < 0.5 ? 0 : 1];
      else if (d > 3) d = NEAR[d][rng() < 0.5 ? 0 : 1];      // 斜めが続きすぎないよう縦横に戻す
      // 端の的は外へ向かって斬らせない (指やマウスが画面の外に出ないように)
      const [dx, dy] = DIRS[d];
      if ((row === 0 && dy < -0.5) || (row === 2 && dy > 0.5) || (col === 0 && dx < -0.5) || (col === cols - 1 && dx > 0.5)) {
        if (Math.abs(dy) > 0.5 && Math.abs(dx) < 0.5) row = 1; else d = OPP[d];
      }
      n.dir = d; pd = d;
    }
    n.col = col; n.row = row; n.done = false; n.spin = rng() * TAU;
    prevT = n.t;
  }
  return list;
}
function layout(api) {
  const { W, H } = api;
  L.cols = W > H * 1.1 ? 4 : 3;
  L.cell = Math.min(W * 0.9 / L.cols, H * 0.58 / 3);
  L.cx = W / 2; L.cy = H * 0.54; L.vx = W / 2; L.vy = H * 0.4;
  const size = DIFF[api.diff].size;
  for (const n of notes) {
    n.px = L.cx + (Math.min(n.col, L.cols - 1) - (L.cols - 1) / 2) * L.cell;
    n.py = L.cy + (n.row - 1) * L.cell;
    n.r = L.cell * (n.big ? 0.43 : 0.36) * size;
  }
}
// 奥行き z (1 = 奥, 0 = 斬る面) での大きさ
const depth = z => z >= 0 ? 1 / (1 + z * 4.2) : 1 - z * 2.4;
function pos(n, tau) {
  const s = depth(-tau / APP);
  return { x: L.vx + (n.px - L.vx) * s, y: L.vy + (n.py - L.vy) * s, s };
}
function distSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / l2, 0, 1) : 0;
  return Math.hypot(p.x - (a.x + dx * t), p.y - (a.y + dy * t));
}

function cut(api, n, ang, tau, p) {
  const S = api.S, a = Math.abs(tau), pn = performance.now();
  const right = n.dir < 0 || Math.cos(ang) * DIRS[n.dir][0] + Math.sin(ang) * DIRS[n.dir][1] >= 0.2;      // 向きはおおらかに (約±78°)
  const kind = !right ? 'ok' : J.feverOn || a <= WIN.crit ? 'crit' : a <= WIN.good ? 'good' : 'ok', K = KIND[kind];
  n.done = true;
  if (right) counts[kind]++; else counts.wrong++;
  J.hit(right ? K.w : 0.2, { mul: n.big ? 2.5 : 1 });
  const hue = n.big ? 45 : HUES[n.type], col = `hsl(${hue} 100% 70%)`, r = n.r * p.s;
  const nx = -Math.sin(ang), ny = Math.cos(ang);
  for (const side of [1, -1]) {
    halves.push({ x: p.x, y: p.y, vx: nx * side * rand(170, 300) * S + Math.cos(ang) * 150 * S, vy: ny * side * rand(170, 300) * S + Math.sin(ang) * 150 * S,
      rot: n.spin, spin: side * rand(2, 6), ang, side, r, hue, dir: n.dir, age: 0, dull: !right });
  }
  slashes.push({ x: p.x, y: p.y, ang, len: r * (kind === 'crit' ? 5.5 : 3.4), t0: pn, crit: kind === 'crit' });
  pops.push({ x: p.x, y: p.y, r, color: right ? K.color : '#8a8fb0', t0: pn, crit: kind === 'crit' });
  if (right) {
    fx.burst(p.x, p.y, kind === 'crit' ? 30 : 14, { colors: [col, '#fff'], v0: 120, v1: kind === 'crit' ? 640 : 380, g: 520 * S, s: kind === 'crit' ? 3 : 2 });
    RG.sfx.noise(kind === 'crit' ? 5200 : 3400, 0.11, 0.3, 'bandpass', 0.35);      // 刃が抜ける音
    RG.sfx.tone(kind === 'crit' ? 1760 : 1320, 0.09, 0.08, 'sine', kind === 'crit' ? 2640 : 1760);
    RG.sfx.chime(J.combo, kind === 'crit');
    if (api.pointer.touch && navigator.vibrate) { try { navigator.vibrate(kind === 'crit' ? 12 : 6); } catch (e) {} }
  } else {
    RG.sfx.noise(500, 0.12, 0.25, 'lowpass', 0.4);                                  // 向き違い: 鈍い音
  }
  if (kind === 'crit') { zoom = Math.max(zoom, 0.7); fx.shake = Math.max(fx.shake, 3); }
  if (n.big && right) {
    fx.flash = 0.35; fx.shake = 13; RG.sfx.cheer(0.4); RG.sfx.noise(300, 0.5, 0.5);
    fx.burst(p.x, p.y, 46, { colors: ['#ffe08a', '#fff', '#ffb070'], v0: 200, v1: 900, g: 300 * S, s: 3, l1: 1.1 });
  }
}

// 刃の軌跡 a→b が、斬る面に届いた的に触れたら斬る
function sweep(api, a, b) {
  const t = api.time(), ang = Math.atan2(b.y - a.y, b.x - a.x);
  for (let i = head; i < notes.length; i++) {
    const n = notes[i], tau = t - n.t;
    if (tau < -WIN.early) break;
    if (n.done || tau > WIN.late) continue;
    const p = pos(n, tau);
    if (distSeg(p, a, b) <= n.r * p.s * 1.25) cut(api, n, ang, tau, p);
  }
}

/* ---- クリスタル: 矢印の向きに斬る。矢印のない金色は好きな向きで ---- */
function drawCrystal(c, r, hue, glow, dir, alpha = 1) {
  const pts = [[0, -r], [r * 0.86, -r * 0.5], [r * 0.86, r * 0.5], [0, r], [-r * 0.86, r * 0.5], [-r * 0.86, -r * 0.5]];
  c.save();
  if (dir >= 0) c.rotate(Math.atan2(DIRS[dir][1], DIRS[dir][0]) + Math.PI / 2);      // 手元の「上」を斬る向きに合わせる
  c.globalAlpha *= alpha;
  c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath();
  const g = c.createLinearGradient(0, r, 0, -r);
  g.addColorStop(0, `hsl(${hue + 30} 90% 26%)`); g.addColorStop(0.55, `hsl(${hue} 95% 52%)`); g.addColorStop(1, `hsl(${hue} 100% 80%)`);
  c.shadowColor = `hsl(${hue} 100% 65%)`; c.shadowBlur = glow; c.fillStyle = g; c.fill(); c.shadowBlur = 0;
  c.strokeStyle = `hsla(${hue},100%,92%,.95)`; c.lineWidth = Math.max(1.2, r * 0.05); c.stroke();
  c.lineCap = 'round'; c.lineJoin = 'round';
  if (dir >= 0) {                               // 矢印 (山形を二つ重ねる)
    c.strokeStyle = '#fff'; c.shadowColor = '#fff'; c.shadowBlur = glow * 0.6;
    c.lineWidth = r * 0.17;
    c.beginPath(); c.moveTo(-r * 0.42, -r * 0.02); c.lineTo(0, -r * 0.46); c.lineTo(r * 0.42, -r * 0.02); c.stroke();
    c.globalAlpha *= 0.6; c.lineWidth = r * 0.13;
    c.beginPath(); c.moveTo(-r * 0.34, r * 0.4); c.lineTo(0, r * 0.04); c.lineTo(r * 0.34, r * 0.4); c.stroke();
    c.shadowBlur = 0;
  } else {                                      // どの向きでも: 二重の輪
    c.strokeStyle = '#fff'; c.lineWidth = r * 0.11;
    c.beginPath(); c.arc(0, 0, r * 0.34, 0, TAU); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, r * 0.12, 0, TAU); c.fill();
  }
  c.restore();
}

RG.shell({
  id: 'slash', title: 'ビートスラッシュ', sub: 'BEAT SLASH', colors: ['#7fe9ff', '#b08cff', '#ff7ab8'], hideCursor: true,
  lead: '<b>曲のリズムに乗って、奥から矢印つきのクリスタルが飛んでくる。矢印の向きに斬れ。</b>手前の枠に届いた瞬間が音の瞬間。',
  how: [['一、待つ', '奥から来たクリスタルが、手前の枠にぴったり重なる瞬間が狙いどき'],
        ['二、斬る', '矢印の向きへ、マウスを素早く動かして通り抜ける。スマホは指で払う'],
        ['三、流れる', '振り下ろしたら次は振り上げ。手が自然に往復するように並んでいる']],
  hint: '金色で矢印のないクリスタルは、どの向きでも斬れて得点2.5倍。連撃で得点が最大4倍。ゲージが満タンで<b style="color:var(--a1)">覚醒</b>し、すべてが会心になります。',
  count: (feat, d) => timeline(feat, d).length, countLabel: n => `クリスタル ${n} 個`,

  start(api) {
    const B = RG.beats(api.song.feat);
    per = B.period; beat0 = B.beats[0] || 0;
    notes = []; layout(api);
    notes = build(api); layout(api);
    head = 0; trail = []; halves = []; slashes = []; pops = []; zoom = 0;
    counts = { crit: 0, good: 0, ok: 0, wrong: 0, miss: 0 }; fx.clear();
    J = new RG.Juice(api, { combo: '連 撃', fever: '覚醒', feverDesc: '得点2倍・すべて会心', lead: api.auto ? 'お手本プレイ' : '矢印の向きに斬れ',
      sub: () => `${J.pct().toFixed(1)}%`,
      onFever() { fx.flash = 0.5; fx.shake = 10; } });
  },
  resize(api) { if (api.state !== 'title') layout(api); },
  quit() { notes = []; J = null; fx.clear(); },
  end(api) {
    api.finish({ score: J.score, pct: J.pct(), names: ['剣聖', '達人', '剣士', '見習い', '修行中'], title: counts.miss + counts.wrong === 0 ? '全斬り' : '',
      stats: [['会心', counts.crit, '#ffe08a'], ['良し', counts.good, '#9ff0c8'], ['斬', counts.ok, '#9cc4ff'], ['向き違い', counts.wrong, '#c9a0a0'],
        ['逃した', counts.miss, '#b0b4cc'], ['最大連撃', J.maxCombo], ['覚醒', J.fevers + ' 回'], ['クリスタル', notes.length]] });
  },

  pointer(api, type) {
    if (api.state !== 'play' || api.auto) return;
    if (type === 'up') { trail.push({ x: -1, y: -1, t: -1e9, gap: true }); return; }
    const P = api.pointer, now = performance.now(), prev = trail[trail.length - 1], cur = { x: P.x, y: P.y, t: now };
    trail.push(cur);
    if (type === 'down' || !prev || prev.gap || now - prev.t > 80) return;
    const d = Math.hypot(cur.x - prev.x, cur.y - prev.y), speed = d / Math.max(1, now - prev.t) * 1000;
    if (d > 1 && (P.down || speed > 420 * api.S)) sweep(api, prev, cur);       // 素早く動かしている間だけ「刃」になる
  },

  frame(api, dt) {
    const { c, W, H, S } = api, pn = performance.now(), playing = api.state === 'play' || api.state === 'pause' || api.state === 'ending';
    const t = playing ? api.time() : pn / 1000, fever = J && J.feverOn && playing;
    if (!playing) { L.cols = W > H * 1.1 ? 4 : 3; L.cell = Math.min(W * 0.9 / L.cols, H * 0.58 / 3); L.cx = W / 2; L.cy = H * 0.54; L.vx = W / 2; L.vy = H * 0.4; }

    // 背景: 奥へ続く光の回廊
    const bg = c.createRadialGradient(L.vx, L.vy, 0, L.vx, L.vy, Math.max(W, H) * 0.8);
    if (fever) { const h = (pn * 0.05) % 360; bg.addColorStop(0, `hsl(${h} 70% 24%)`); bg.addColorStop(1, `hsl(${(h + 60) % 360} 80% 5%)`); }
    else { bg.addColorStop(0, `hsl(250 60% ${15 + RG.audio.bass * 10}%)`); bg.addColorStop(1, '#04050f'); }
    c.fillStyle = bg; c.fillRect(0, 0, W, H);
    const fw = L.cols * L.cell / 2 + L.cell * 0.12, fh = 1.5 * L.cell + L.cell * 0.12;
    const hueB = fever ? (pn * 0.2) % 360 : 215;
    c.lineWidth = 1.5;                                   // 四隅から奥へ伸びる線
    c.strokeStyle = `hsla(${hueB},100%,72%,.22)`;
    c.beginPath();
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      const x = L.cx + sx * fw, y = L.cy + sy * fh;
      c.moveTo(L.vx + (x - L.vx) * 0.04, L.vy + (y - L.vy) * 0.04); c.lineTo(L.vx + (x - L.vx) * 2.6, L.vy + (y - L.vy) * 2.6);
    }
    c.stroke();
    const ph = (((t - beat0) / per) % 1 + 1) % 1;         // 拍ごとに枠が奥から流れてくる (的と同じ速さ)
    for (let k = 0; k < Math.ceil(APP / per) + 2; k++) {
      const z = (k - ph) * per / APP;
      if (z > 1.3 || z < -0.3) continue;
      const s = depth(z), a = clamp(1.25 - z, 0, 1) * (z < 0 ? clamp(1 + z * 4, 0, 1) : 1);
      c.strokeStyle = `hsla(${hueB},100%,70%,${0.26 * a})`; c.lineWidth = 1 + s * 1.2;
      c.strokeRect(L.vx + (L.cx - fw - L.vx) * s, L.vy + (L.cy - fh - L.vy) * s, fw * 2 * s, fh * 2 * s);
    }
    // 斬る面の枠 (ここに届いた瞬間に斬る)
    const pulse = Math.pow(1 - ph, 3);
    c.strokeStyle = `hsla(${hueB},100%,${78 + pulse * 14}%,${0.55 + pulse * 0.35})`; c.lineWidth = 2 + pulse * 2;
    c.shadowColor = `hsl(${hueB} 100% 70%)`; c.shadowBlur = 8 + pulse * 14;
    const cr = L.cell * 0.18;
    c.beginPath();
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {      // 四隅のかぎ括弧
      const x = L.cx + sx * fw, y = L.cy + sy * fh;
      c.moveTo(x - sx * cr * 2.2, y); c.lineTo(x, y); c.lineTo(x, y - sy * cr * 2.2);
    }
    c.stroke(); c.shadowBlur = 0;
    if (!playing || !J) { fx.step(dt); return; }

    if (api.state === 'play') {
      J.update();
      for (let i = head; i < notes.length; i++) {
        const n = notes[i], tau = t - n.t;
        if (tau < -APP) break;
        if (n.done) continue;
        if (api.auto && tau >= 0) {                      // お手本: 届いた瞬間に矢印の向きへ斬る
          const p = pos(n, 0), a = n.dir < 0 ? rand(0, TAU) : Math.atan2(DIRS[n.dir][1], DIRS[n.dir][0]), R = n.r * 2.4;
          trail.push({ x: -1, y: -1, t: -1e9, gap: true }, { x: p.x - Math.cos(a) * R, y: p.y - Math.sin(a) * R, t: pn - 30 }, { x: p.x + Math.cos(a) * R, y: p.y + Math.sin(a) * R, t: pn });
          cut(api, n, a, 0, p); continue;
        }
        if (tau > WIN.late) { n.done = true; counts.miss++; J.miss(); RG.sfx.noise(260, 0.12, 0.14, 'lowpass', 0.5); }
      }
      while (head < notes.length && notes[head].done) head++;
    }
    fx.step(dt);
    zoom *= Math.pow(0.8, dt * 60);

    c.save();
    const sc = 1 + zoom * 0.02;
    c.translate(W / 2 + (Math.random() - 0.5) * fx.shake, H / 2 + (Math.random() - 0.5) * fx.shake); c.scale(sc, sc); c.translate(-W / 2, -H / 2);

    // クリスタル (奥のものから描く)
    let last = head;
    while (last < notes.length && notes[last].t - t <= APP) last++;
    for (let i = last - 1; i >= head; i--) {
      const n = notes[i], tau = t - n.t;
      if (n.done) continue;
      const p = pos(n, tau), z = -tau / APP, hue = n.big ? 45 : HUES[n.type], near = Math.max(0, 1 - Math.abs(tau) / 0.1);
      const a = clamp((1.02 - z) * 5, 0, 1) * (tau > 0 ? clamp(1 - tau / WIN.late * 0.7, 0, 1) : 1);
      const r = n.r * p.s;
      if (tau < 0 && z < 0.5) {                          // 届く直前: 枠の中の「ここ」に輪が締まる
        const k = z / 0.5, q = pos(n, 0);
        c.strokeStyle = `hsla(${hue},100%,85%,${0.75 * (1 - k)})`; c.lineWidth = 2.2;
        c.beginPath(); c.arc(q.x, q.y, n.r * (1.12 + 0.9 * k), 0, TAU); c.stroke();
      }
      c.save(); c.translate(p.x, p.y); c.globalAlpha = a;
      if (n.dir < 0) c.rotate(n.spin + t * 1.2);
      const s = 1 + near * 0.12; c.scale(s, s);
      drawCrystal(c, r, hue, (10 + near * 26 + (n.big ? 12 : 0)) * Math.min(1, p.s * 1.4), n.dir);
      if (near > 0) { c.globalAlpha = near * 0.45; c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, r * 0.95, 0, TAU); c.fill(); }
      c.restore();
    }
    // 斬られた半分
    for (let i = halves.length - 1; i >= 0; i--) {
      const h = halves[i]; h.age += dt;
      if (h.age > 0.42) { halves.splice(i, 1); continue; }
      h.vy += 900 * S * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.rot += h.spin * dt;
      c.save(); c.globalAlpha = Math.pow(1 - h.age / 0.42, 1.5) * (h.dull ? 0.5 : 0.9); c.translate(h.x, h.y); c.rotate(h.ang);
      c.beginPath(); c.rect(-h.r * 3, h.side > 0 ? 0 : -h.r * 3, h.r * 6, h.r * 3); c.clip();
      c.rotate(-h.ang); c.scale(1 + h.age * 0.8, 1 + h.age * 0.8);
      drawCrystal(c, h.r, h.dull ? 230 : h.hue, 0, h.dir);
      c.restore();
    }
    // 命中の輪 (色で出来ばえが分かる: 金 = 会心, 緑 = 良し, 青 = 斬, 灰 = 向き違い)
    for (let i = pops.length - 1; i >= 0; i--) {
      const o = pops[i], p = (pn - o.t0) / 380;
      if (p >= 1) { pops.splice(i, 1); continue; }
      const e = 1 - (1 - p) * (1 - p);
      c.globalAlpha = 1 - p; c.strokeStyle = o.color; c.lineWidth = 5 * (1 - p) + 0.5;
      c.beginPath(); c.arc(o.x, o.y, o.r * (1 + e * 1.6), 0, TAU); c.stroke();
    }
    c.globalAlpha = 1;
    // 斬撃の閃光
    c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
    for (let i = slashes.length - 1; i >= 0; i--) {
      const s = slashes[i], p = (pn - s.t0) / (s.crit ? 260 : 180);
      if (p >= 1) { slashes.splice(i, 1); continue; }
      const len = s.len * (0.6 + p * 0.6), dx = Math.cos(s.ang) * len, dy = Math.sin(s.ang) * len;
      c.globalAlpha = 1 - p; c.strokeStyle = s.crit ? '#fff6d0' : '#cfe8ff'; c.lineWidth = (s.crit ? 9 : 5) * (1 - p) + 1;
      c.beginPath(); c.moveTo(s.x - dx, s.y - dy); c.lineTo(s.x + dx, s.y + dy); c.stroke();
    }
    // 刃の軌跡
    while (trail.length && pn - trail[0].t > 170) trail.shift();
    for (let i = 1; i < trail.length; i++) {
      const a = trail[i - 1], b = trail[i], k = 1 - (pn - b.t) / 170;
      if (a.gap || b.gap || b.t - a.t > 80) continue;
      c.globalAlpha = k * 0.7; c.strokeStyle = fever ? `hsl(${(pn * 0.6 + i * 25) % 360} 100% 65%)` : '#6fe3ff'; c.lineWidth = (fever ? 22 : 14) * k;
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
      c.globalAlpha = k; c.strokeStyle = '#fff'; c.lineWidth = 5 * k;
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
    }
    c.restore();
    fx.draw(c);
    if (!api.pointer.touch && !api.auto && api.state === 'play') {          // カーソル
      const P = api.pointer;
      c.fillStyle = '#fff'; c.shadowColor = '#6fe3ff'; c.shadowBlur = 12;
      c.beginPath(); c.moveTo(P.x, P.y - 7); c.lineTo(P.x + 5, P.y); c.lineTo(P.x, P.y + 7); c.lineTo(P.x - 5, P.y); c.closePath(); c.fill(); c.shadowBlur = 0;
    }
    c.restore();
    fx.drawFlash(c, W, H);
    J.draw(c);
  },
});
</script>
