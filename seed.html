<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ソングシード - 曲から生まれるゲーム</title>
<link rel="stylesheet" href="common.css">
<style>
  #seed { margin-top: 10px; border-radius: 18px; padding: 14px 16px; background: var(--panel2); border: 1px solid var(--line); display: none; }
  #seed.on { display: block; animation: card .5s var(--ease); }
  .seed-cap { font-size: 10.5px; letter-spacing: .26em; font-weight: 700; color: var(--a1); }
  .seed-name { font-size: 25px; font-weight: 800; font-style: italic; margin-top: 4px; line-height: 1.25;
    background: linear-gradient(100deg, var(--a1), var(--a2) 50%, var(--a3)); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block; padding-right: 6px; }
  .seed-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .seed-tags span { font-size: 11.5px; padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--text); }
  .tl { display: flex; height: 12px; margin-top: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
  .tl i { display: block; border-radius: 2px; min-width: 2px; }
  .seed-leg { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--sub); flex-wrap: wrap; }
  .seed-leg b { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
</style>
</head>
<body>
<script src="common.js"></script>
<script>
'use strict';
const { TAU, clamp, rand } = RG;
const DIFF = {
  easy:   { mult: 1.7,  gap: 0.5 },
  normal: { mult: 1.45, gap: 0.3 },
  hard:   { mult: 1.25, gap: 0.2 },
};
const COARSE = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
const WIN = { crit: 0.07, good: 0.13, ok: 0.19, slash: 0.2 };
const KIND = { crit: { color: '#ffe08a', w: 1 }, good: { color: '#9ff0c8', w: 0.7 }, ok: { color: '#9cc4ff', w: 0.35 } };
const MODES = { tap: 'たたく', slash: '斬る', trace: 'なぞる' };
const KEY_NAMES = ['ド', 'ド♯', 'レ', 'ミ♭', 'ミ', 'ファ', 'ファ♯', 'ソ', 'ラ♭', 'ラ', 'シ♭', 'シ'];

/* ============================================================
 *  1. 曲を聴く: 調 (長調/短調)・音の明るさ・打楽器の強さ・盛り上がりの移り変わり
 * ============================================================ */
const CN = 4096;
const cTab = (() => {
  const n = CN, rev = new Uint16Array(n), cos = new Float32Array(n / 2), sin = new Float32Array(n / 2), win = new Float32Array(n), bits = Math.log2(n);

function fftBig(re, im) {

// 和音とメロディ (12音それぞれの強さ) と、音の明るさ
function tonal(buffer) {

  const re = new Float32Array(CN), im = new Float32Array(CN), pc = new Int8Array(CN / 2).fill(-1), lg = new Float32Array(CN / 2);
  for (let k = 1; k < CN / 2; k++) {

    for (let k = 1; k <= k1; k++) {

      if (k >= k0) { cs += m * lg[k]; cw += m; }

  const MAJ = [6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88], MIN = [6.33, 2.68, 3.52, 5.38, 2.60, 3.53, 2.54, 4.75, 3.98, 2.69, 3.34, 3.17];
  const corr = (prof, sh) => {
    let ma = 0, mb = 0; for (let k = 0; k < 12; k++) { ma += tot[k]; mb += prof[k]; } ma /= 12; mb /= 12;
    let n = 0, da = 0, db = 0;

  (key.minor ? [0, 3, 5, 7, 10] : [0, 2, 4, 7, 9]).forEach(d => scale[(key.tonic + d) % 12] = 1);

  return { chroma, cF, hopSec: hop / sr, key, scale, bright };
}

const THEMES = {
  neon:   { noun: 'ネオンの街',     hue: 190, span: 130 },
  deep:   { noun: '深い海',         hue: 185, span: 40 },
  aurora: { noun: 'オーロラの夜',   hue: 150, span: 120 },
  dawn:   { noun: '朝焼けの丘',     hue: 20,  span: 40 },
};
// 曲の「種」: この曲からどんなゲームが育つかを決める
function seedOf(song) {
  const feat = song.feat, mode = feat.tempoMode ?? 1;

  const T = feat.tonal, B = RG.beats(feat), { flux, frames, dt, env } = feat;
  // 打楽器の強さ: とがった音の立ち上がりが、全体に比べてどれだけ目立つか
  const sorted = Array.from(flux).sort((x, y) => y - x); let top = 0, all = 0;
  const nt = Math.max(1, Math.floor(frames * 0.04));
  for (let i = 0; i < frames; i++) { all += sorted[i]; if (i < nt) top += sorted[i]; }
  const perc = clamp(((top / nt) / (all / frames + 1e-9) - 2.2) / 3.2, 0, 1);
  const bpm = B.bpm, minor = T.key.minor, bright = T.bright;

  const theme = bpm >= 122 && perc > 0.45 ? 'neon' : minor ? (bright < 0.42 || bpm < 92 ? 'deep' : 'aurora') : (bright > 0.4 ? 'dawn' : 'aurora');
  const TH = THEMES[theme], h1 = (TH.hue + (T.key.tonic / 12 - 0.5) * TH.span + 360) % 360;
  const pal = { h1, h2: (h1 + (theme === 'dawn' ? 320 : 60)) % 360, h3: (h1 + (theme === 'dawn' ? 290 : 130)) % 360 };
  const adj = bpm < 88 ? 'ゆるやかな' : bpm < 112 ? '弾む' : bpm < 138 ? '駆ける' : '疾走する';

  const pe = new Float64Array(frames + 1); for (let i = 0; i < frames; i++) pe[i + 1] = pe[i] + env[i];

  const lv = bl.map(x => x.lv).sort((x, y) => x - y), qt = q => lv[Math.min(lv.length - 1, Math.floor(lv.length * q))] ?? 0;

  const flat = hi - lo < 0.06;
  bl.forEach((x, i) => { x.mode = flat ? ['tap', 'tap', 'slash', 'tap', 'trace', 'tap'][(i >> 1) % 6] : x.lv <= lo ? 'trace' : x.lv >= hi ? 'slash' : 'tap'; });
  for (let i = 1; i + 1 < bl.length; i++) if (bl[i].mode !== bl[i - 1].mode && bl[i].mode !== bl[i + 1].mode) bl[i].mode = bl[i - 1].mode;   // 8拍だけの切り替えはならす
  const sections = [];
  for (const x of bl) { const s = sections[sections.length - 1]; if (s && s.mode === x.mode) s.t1 = x.t1; else sections.push({ t0: x.t0, t1: x.t1, mode: x.mode }); }
  if (sections.length) { sections[0].t0 = -10; sections[sections.length - 1].t1 = 1e9; }

/* ============================================================
 *  2. 譜面: 拍に合わせた音の並びに、その区間の遊び方と場所を割り当てる
 * ============================================================ */

  const groups = [];

    let j = i; while (j + 1 < list.length && list[j + 1].kind === 'trace' && list[j + 1].t - list[j].t <= B.period * 2.2) j++;
    if (j - i + 1 >= 3) { const g = { a: i, b: j }; groups.push(g); for (let k = i; k <= j; k++) list[k].grp = g; }

    i = j + 1;
  }

  let u = 0.5, v = 0.5, ang = rng() * TAU, prevT = -10;

    const gap = n.t - prevT; n.gapS = gap;

let notes = [], groups = [], SD = null, head = 0, J = null, fx = new RG.Fx(), counts = {}, pops = [], trail = [], changes = [];

    if (n.jump) { x = G.x0 + n.jump[0] * G.w; y = G.y0 + n.jump[1] * G.h; ang = n.jump[2]; }
    else {
      const d = n.kind === 'trace' ? n.step * Math.min(G.w, G.h) * 1.5 : Math.max(minD, n.step * Math.min(G.w, G.h) * 1.4);

      for (let k = 0; k < 8; k++) {

        if (nx < G.x0 || nx > G.x0 + G.w) { ang = Math.PI - ang; continue; }
        if (ny < G.y0 || ny > G.y0 + G.h) { ang = -ang; continue; }
        x = nx; y = ny; break;
      }
      x = clamp(x, G.x0, G.x0 + G.w); y = clamp(y, G.y0, G.y0 + G.h);
    }
    n.x = x; n.y = y; n.r = G.r * (n.big ? 1.2 : 1);

  for (let i = 0; i < notes.length; i++) {            // 斬る向き: 次の的のほうへ
    const n = notes[i], nx = notes[i + 1];
    if (n.kind === 'slash') n.fa = nx && nx.t - n.t < 1.6 && Math.hypot(nx.x - n.x, nx.y - n.y) > n.r ? Math.atan2(nx.y - n.y, nx.x - n.x) : -Math.PI / 2 + (n.r1 - 0.5) * 1.6;

}
// なぞる光の玉の位置 (グループの中の時刻 t)
function orbAt(g, t) {

/* ============================================================
 *  3. 判定と手応え
 * ============================================================ */
function judge(api, n, kind, ok = true, at) {

  pops.push({ x, y, r: n.r, color: ok ? K.color : '#8a8fb0', t0: pn, crit: ok && kind === 'crit' });
  if (!ok) { RG.sfx.noise(500, 0.12, 0.2, 'lowpass', 0.4); return; }
  const hue = [P.h1, P.h2, P.h3, P.h1][n.type];
  fx.burst(x, y, kind === 'crit' ? (n.kind === 'trace' ? 12 : 26) : 10, { colors: [`hsl(${hue} 100% 72%)`, '#fff'], v0: 100, v1: kind === 'crit' ? 560 : 320, g: 480 * api.S, s: kind === 'crit' ? 3 : 2 });

}
let slashes = [];
const timing = a => J.feverOn || a <= WIN.crit ? 'crit' : a <= WIN.good ? 'good' : 'ok';
function tapAt(api, x, y) {

  const t = api.time(), ang = Math.atan2(b.y - a.y, b.x - a.x);

    const n = notes[i];
    if (n.t - t > WIN.slash) break;

    if (distSeg(n, a, b) > n.r * 1.25) continue;

/* ============================================================
 *  4. 世界の描画 (曲から決まった世界ごとに背景が変わる)
 * ============================================================ */
const dust = Array.from({ length: 70 }, (_, i) => ({ x: Math.random(), y: Math.random(), s: 0.4 + Math.random(), p: Math.random() * TAU }));
function world(c, W, H, t, pulse, S, fever) {
  const P = S ? S.pal : { h1: 215, h2: 275, h3: 330 }, th = S ? S.theme : 'aurora', bass = RG.audio.bass, pn = performance.now() / 1000;
  const hs = fever ? (pn * 40) % 360 : 0, h1 = (P.h1 + hs) % 360, h2 = (P.h2 + hs) % 360, h3 = (P.h3 + hs) % 360;
  const g = c.createLinearGradient(0, 0, 0, H);
  if (th === 'dawn') { g.addColorStop(0, `hsl(${h3} 55% ${24 + bass * 8}%)`); g.addColorStop(0.6, `hsl(${h1} 75% ${46 + bass * 10}%)`); g.addColorStop(1, `hsl(${h2} 60% 24%)`); }

      c.globalAlpha = 1 - p; c.strokeStyle = '#fff6d0'; c.lineWidth = 7 * (1 - p) + 1;
      c.beginPath(); c.moveTo(s.x - dx, s.y - dy); c.lineTo(s.x + dx, s.y + dy); c.stroke();
    }
    while (trail.length && pn - trail[0].t > 170) trail.shift();
    for (let i = 1; i < trail.length; i++) {
      const a = trail[i - 1], b = trail[i], k = 1 - (pn - b.t) / 170;
      if (a.gap || b.gap || b.t - a.t > 80) continue;
      c.globalAlpha = k * 0.6; c.strokeStyle = `hsl(${P.h1} 100% 70%)`; c.lineWidth = 12 * k;
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
      c.globalAlpha = k; c.strokeStyle = '#fff'; c.lineWidth = 4 * k;
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
    }
    c.restore();
    c.restore();
    fx.draw(c);
    // ---- 遊び方が切り替わる前に、次の遊び方の印を中央に出す ----
    for (const ch of changes) {
      const d = t - (ch.t - APP);
      if (d < -0.1 || d > 1.1) continue;
      const k = clamp(d / 1.1, 0, 1), al = Math.sin(Math.min(1, k * 1.15) * Math.PI) * 0.9, s = Math.min(W, H) * (0.16 + 0.05 * k), hue = ch.mode === 'tap' ? P.h1 : ch.mode === 'slash' ? P.h3 : P.h2;
      c.globalAlpha = al * 0.5; c.fillStyle = 'rgba(4,5,18,.8)'; c.beginPath(); c.arc(W / 2, H * 0.47, s * 0.95, 0, TAU); c.fill();
      c.globalAlpha = al; c.strokeStyle = `hsl(${hue} 100% 80%)`; c.shadowColor = c.strokeStyle; c.shadowBlur = 18;
      icon(c, ch.mode, W / 2, H * 0.47, s); c.shadowBlur = 0; c.globalAlpha = 1;
    }
    fx.drawFlash(c, W, H);
    J.draw(c);
  },
});
</script>
