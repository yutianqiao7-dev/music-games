<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>クラシック4レーン - 落ちてくる音を叩く</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<script src="common.js"></script>
<script>
'use strict';
const { TAU, clamp, rand } = RG;
const DIFF = {
  easy:   { mult: 1.7,  gap: 0.5,  fall: 1.5 },
  normal: { mult: 1.45, gap: 0.3,  fall: 1.2 },
  hard:   { mult: 1.25, gap: 0.19, fall: 0.95 },
};
const KEYS = ['KeyD', 'KeyF', 'KeyJ', 'KeyK'], LABEL = ['D', 'F', 'J', 'K'], HUES = [195, 265, 320, 40];
const WIN = { crit: 0.05, good: 0.1, ok: 0.16 };
const KIND = { crit: { color: '#ffe08a', w: 1 }, good: { color: '#9ff0c8', w: 0.7 }, ok: { color: '#9cc4ff', w: 0.35 } };
const fx = new RG.Fx();
let notes = [], head = 0, J = null, counts = {}, press = [0, 0, 0, 0], held = [false, false, false, false], pops = [], fall = 1.2;
let G = { x: 0, w: 0, lane: 0, hitY: 0, top: 0 }, per = 0.5, beat0 = 0;

/* その曲の拍に合わせた音の並びを、4つのレーンに振り分ける (同じレーンが続きすぎないように) */
function chart(feat, diff) {
  const list = RG.onsets(feat, DIFF[diff]), rng = RG.rng(feat.seed + diff.length * 17);
  let prev = -1, run = 0;
  for (const n of list) {
    let lane = n.type;                                   // 音の高さ → レーン (低い音が左)
    if (n.fill) lane = (prev + (rng() < 0.5 ? 1 : 3)) % 4;
    if (lane === prev && (++run >= 2 || n.gap < 0.22)) { lane = (lane + (rng() < 0.5 ? 1 : 3)) % 4; }
    if (lane !== prev) run = 0;
    n.lane = lane; prev = lane;
  }
  return list;
}
function layout(api) {
  const { W, H } = api;
  G.w = Math.min(W * 0.94, 460 * Math.max(1, api.S)); G.x = (W - G.w) / 2; G.lane = G.w / 4;
  G.hitY = H * 0.8; G.top = -40;
}
function hit(api, lane) {
  press[lane] = performance.now();
  if (api.state !== 'play' || api.auto) return;
  const t = api.time();
  for (let i = head; i < notes.length; i++) {
    const n = notes[i];
    if (n.t - t > WIN.ok) break;
    if (n.done || n.lane !== lane) continue;
    judge(api, n, t - n.t); return;
  }
  RG.sfx.noise(900, 0.05, 0.08, 'highpass', 1);            // 空打ち
}
function judge(api, n, tau) {
  const a = Math.abs(tau), kind = J.feverOn || a <= WIN.crit ? 'crit' : a <= WIN.good ? 'good' : 'ok', K = KIND[kind];
  n.done = true; counts[kind]++;
  J.hit(K.w, { mul: n.big ? 2 : 1 });
  const x = G.x + (n.lane + 0.5) * G.lane, hue = HUES[n.lane];
  pops.push({ x, y: G.hitY, color: K.color, t0: performance.now(), crit: kind === 'crit' });
  fx.burst(x, G.hitY, kind === 'crit' ? 22 : 10, { colors: [`hsl(${hue} 100% 72%)`, '#fff'], v0: 100, v1: kind === 'crit' ? 520 : 300, g: 600 * api.S, s: kind === 'crit' ? 3 : 2 });
  RG.sfx.noise(4200, 0.05, 0.12, 'highpass', 1);
  RG.sfx.chime(J.combo, kind === 'crit');
  if (n.big) { fx.flash = 0.25; fx.shake = 8; RG.sfx.noise(300, 0.4, 0.4); }
  if (api.pointer.touch && navigator.vibrate) { try { navigator.vibrate(kind === 'crit' ? 10 : 5); } catch (e) {} }
}
const laneAt = x => clamp(Math.floor((x - G.x) / G.lane), 0, 3);

RG.shell({
  id: 'classic', title: 'クラシック4レーン', sub: 'CLASSIC LANES', colors: ['#7fd4ff', '#b08cff', '#ff8fd0'],
  lead: '<b>曲の拍に合わせて落ちてくる光を、線に重なった瞬間に叩く。</b>おなじみの形式を、あなたの曲で。',
  how: [['一、見る', '4つのレーンを光が落ちてくる。下の線に重なる瞬間が音の瞬間'],
        ['二、叩く', '<kbd>D</kbd> <kbd>F</kbd> <kbd>J</kbd> <kbd>K</kbd> を押す。スマホはレーンをタップ'],
        ['三、続ける', '逃さず叩き続けると得点が最大4倍に']],
  hint: 'ゲージが満タンで<b style="color:var(--a1)">フィーバー</b>に入り、得点2倍・すべてが最高判定になります。',
  count: (f, d) => RG.onsets(f, DIFF[d]).length, countLabel: n => `ノーツ ${n} 個`,

  start(api) {
    const B = RG.beats(api.song.feat); per = B.period; beat0 = B.beats[0] || 0;
    notes = chart(api.song.feat, api.diff); fall = DIFF[api.diff].fall; layout(api);
    head = 0; pops = []; press = [0, 0, 0, 0]; counts = { crit: 0, good: 0, ok: 0, miss: 0 }; fx.clear();
    J = new RG.Juice(api, { lead: api.auto ? 'お手本プレイ' : '線に重なる瞬間に叩こう', sub: () => `${J.pct().toFixed(1)}%`, onFever() { fx.flash = 0.45; fx.shake = 8; } });
  },
  resize(api) { layout(api); },
  quit() { notes = []; J = null; fx.clear(); },
  end(api) {
    api.finish({ score: J.score, pct: J.pct(), names: ['神業', '達人', '上手', 'まずまず', '練習中'], title: counts.miss === 0 ? 'フルコンボ' : '',
      stats: [['最高', counts.crit, '#ffe08a'], ['良い', counts.good, '#9ff0c8'], ['可', counts.ok, '#9cc4ff'], ['ミス', counts.miss, '#b0b4cc'],
        ['最大コンボ', J.maxCombo], ['フィーバー', J.fevers + ' 回'], ['ノーツ', notes.length], ['テンポ', Math.round(60 / per)]] });
  },
  key(api, code, down) { const l = KEYS.indexOf(code); if (l < 0) return; held[l] = down; if (down) hit(api, l); },
  pointer(api, type, e) { if (type === 'down' && api.state === 'play' && e.clientY > api.H * 0.25) hit(api, laneAt(e.clientX)); },

  frame(api, dt) {
    const { c, W, H, S } = api, pn = performance.now(), playing = api.state === 'play' || api.state === 'pause' || api.state === 'ending';
    const t = playing ? api.time() : pn / 1000, fever = J && J.feverOn && playing;
    if (!playing) layout(api);
    // 背景
    const bg = c.createLinearGradient(0, 0, 0, H);
    if (fever) { const h = (pn * 0.05) % 360; bg.addColorStop(0, `hsl(${h} 60% 10%)`); bg.addColorStop(1, `hsl(${(h + 50) % 360} 70% 18%)`); }
    else { bg.addColorStop(0, '#05060f'); bg.addColorStop(1, `hsl(245 55% ${11 + RG.audio.bass * 9}%)`); }
    c.fillStyle = bg; c.fillRect(0, 0, W, H);
    const ph = (((t - beat0) / per) % 1 + 1) % 1, pulse = Math.pow(1 - ph, 3);
    // レーン
    for (let l = 0; l < 4; l++) {
      const x = G.x + l * G.lane, hue = HUES[l], lit = Math.max(0, 1 - (pn - press[l]) / 180);
      const g = c.createLinearGradient(0, 0, 0, G.hitY);
      g.addColorStop(0, `hsla(${hue},90%,60%,0)`); g.addColorStop(1, `hsla(${hue},90%,60%,${0.07 + lit * 0.22 + pulse * 0.04})`);
      c.fillStyle = g; c.fillRect(x + 1, 0, G.lane - 2, G.hitY);
      c.fillStyle = `hsla(${hue},90%,62%,${0.05 + lit * 0.25})`; c.fillRect(x + 1, G.hitY, G.lane - 2, H - G.hitY);
    }
    c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 1;
    c.beginPath(); for (let l = 0; l <= 4; l++) { c.moveTo(G.x + l * G.lane, 0); c.lineTo(G.x + l * G.lane, H); } c.stroke();
    // 拍ごとの横線が同じ速さで流れてくる
    if (playing) for (let k = 0; k < Math.ceil(fall / per) + 1; k++) {
      const y = G.hitY - (k - ph) * per / fall * (G.hitY - G.top);
      if (y < 0) break;
      c.strokeStyle = 'rgba(255,255,255,.07)'; c.beginPath(); c.moveTo(G.x, y); c.lineTo(G.x + G.w, y); c.stroke();
    }
    // 叩く線
    const lg = c.createLinearGradient(G.x, 0, G.x + G.w, 0);
    HUES.forEach((h, i) => lg.addColorStop(i / 3, `hsl(${h} 100% 72%)`));
    c.strokeStyle = lg; c.lineWidth = 3 + pulse * 2; c.shadowColor = '#fff'; c.shadowBlur = 8 + pulse * 14;
    c.beginPath(); c.moveTo(G.x, G.hitY); c.lineTo(G.x + G.w, G.hitY); c.stroke(); c.shadowBlur = 0;
    // キー
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (let l = 0; l < 4; l++) {
      const x = G.x + (l + 0.5) * G.lane, y = G.hitY + Math.min(54 * S, (H - G.hitY) * 0.45), lit = Math.max(0, 1 - (pn - press[l]) / 180), r = Math.min(G.lane * 0.3, 26 * S);
      c.fillStyle = `hsla(${HUES[l]},90%,${22 + lit * 40}%,.8)`; c.strokeStyle = `hsla(${HUES[l]},100%,75%,${0.5 + lit * 0.5})`; c.lineWidth = 1.5;
      c.beginPath(); if (c.roundRect) c.roundRect(x - r, y - r, r * 2, r * 2, r * 0.35); else c.rect(x - r, y - r, r * 2, r * 2); c.fill(); c.stroke();
      if (!api.pointer.touch) { c.fillStyle = `rgba(255,255,255,${0.75 + lit * 0.25})`; c.font = `800 ${Math.round(r * 0.85)}px ${RG.FONT}`; c.fillText(LABEL[l], x, y + 1); }
    }
    if (!playing || !J) { fx.step(dt); return; }

    if (api.state === 'play') {
      J.update();
      for (let i = head; i < notes.length; i++) {
        const n = notes[i], tau = t - n.t;
        if (tau < -fall) break;
        if (n.done) continue;
        if (api.auto && tau >= 0) { press[n.lane] = pn; judge(api, n, 0); continue; }
        if (tau > WIN.ok) { n.done = true; counts.miss++; J.miss(); }
      }
      while (head < notes.length && notes[head].done) head++;
    }
    fx.step(dt);
    c.save(); c.translate((Math.random() - 0.5) * fx.shake, (Math.random() - 0.5) * fx.shake);
    // ノーツ
    for (let i = head; i < notes.length; i++) {
      const n = notes[i], tau = t - n.t;
      if (tau < -fall) break;
      if (n.done) continue;
      const y = G.hitY + tau / fall * (G.hitY - G.top), x = G.x + n.lane * G.lane, hue = n.big ? 45 : HUES[n.lane];
      const hh = (n.big ? 26 : 18) * S, pad = G.lane * 0.08;
      const g = c.createLinearGradient(0, y - hh / 2, 0, y + hh / 2);
      g.addColorStop(0, `hsl(${hue} 100% 86%)`); g.addColorStop(1, `hsl(${hue} 95% 56%)`);
      c.fillStyle = g; c.shadowColor = `hsl(${hue} 100% 62%)`; c.shadowBlur = n.big ? 22 : 12;
      c.globalAlpha = tau > 0 ? clamp(1 - tau / WIN.ok, 0.2, 1) : 1;
      c.beginPath(); if (c.roundRect) c.roundRect(x + pad, y - hh / 2, G.lane - pad * 2, hh, hh / 2); else c.rect(x + pad, y - hh / 2, G.lane - pad * 2, hh); c.fill();
      c.shadowBlur = 0; c.globalAlpha = 1;
    }
    // 命中の輪 (色で出来ばえが分かる)
    for (let i = pops.length - 1; i >= 0; i--) {
      const o = pops[i], p = (pn - o.t0) / 340;
      if (p >= 1) { pops.splice(i, 1); continue; }
      c.globalAlpha = 1 - p; c.strokeStyle = o.color; c.lineWidth = 4 * (1 - p) + 0.5;
      c.beginPath(); c.ellipse(o.x, o.y, G.lane * (0.4 + p * 0.5), G.lane * (0.14 + p * 0.3), 0, 0, TAU); c.stroke();
    }
    c.globalAlpha = 1; c.restore();
    fx.draw(c);
    fx.drawFlash(c, W, H);
    J.draw(c);
  },
});
</script>
</body>
</html>
