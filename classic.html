<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>My Rhythm - 好きな曲で音ゲー</title>
<style>
  :root {
    --bg: #0b0d1a;
    --panel: #161a30;
    --line: #2a3055;
    --text: #e8ebff;
    --sub: #8f97c4;
    --accent: #6cf;
    --l0: #ff5d8f; --l1: #ffc145; --l2: #4de3a4; --l3: #5aa9ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", Meiryo, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 20px; overflow-y: auto; }
  .screen.on { display: flex; }
  .dim { background: rgba(8, 10, 22, .82); backdrop-filter: blur(6px); }
  .card { width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: .04em;
    background: linear-gradient(90deg, var(--l0), var(--l1), var(--l2), var(--l3));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { margin: 0 0 16px; font-size: 22px; }
  p.lead { margin: 0 0 20px; color: var(--sub); font-size: 14px; }
  #drop { border: 2px dashed var(--line); border-radius: 14px; padding: 28px 16px; text-align: center;
    cursor: pointer; transition: .15s; color: var(--sub); }
  #drop:hover, #drop.over { border-color: var(--accent); color: var(--text); background: rgba(102,204,255,.06); }
  #drop strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
  #fileName { margin-top: 10px; color: var(--accent); font-size: 14px; word-break: break-all; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 12px; display: none; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--l2), var(--l3)); }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 16px; font-size: 14px; }
  .row > label:first-child, .row > span:first-child { width: 88px; color: var(--sub); flex: none; }
  .seg { display: flex; flex: 1; background: var(--bg); border-radius: 10px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--sub); padding: 8px 0; border-radius: 8px;
    font: inherit; cursor: pointer; }
  .seg button.sel { background: var(--line); color: var(--text); font-weight: 600; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .val { width: 64px; text-align: right; color: var(--sub); font-variant-numeric: tabular-nums; }
  .btn { display: block; width: 100%; margin-top: 12px; padding: 13px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; font-size: 16px; cursor: pointer; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.primary { margin-top: 22px; border: 0; font-weight: 700; color: #08101f;
    background: linear-gradient(90deg, var(--l2), var(--l3)); }
  .btn:disabled { opacity: .35; cursor: default; }
  .hint { margin-top: 16px; font-size: 12.5px; color: var(--sub); line-height: 1.7; }
  kbd { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; color: var(--text);
    font-family: inherit; }
  .err { color: #ff7b7b; font-size: 13px; margin-top: 10px; min-height: 1em; }
  #rank { font-size: 84px; font-weight: 800; line-height: 1; text-align: center; margin: 4px 0 8px; }
  #resSong { text-align: center; color: var(--sub); font-size: 13px; word-break: break-all; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 15px; }
  td { padding: 7px 4px; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  #pauseBtn { position: fixed; top: 12px; right: 12px; z-index: 5; display: none; width: 42px; height: 42px;
    border-radius: 50%; border: 1px solid var(--line); background: rgba(22,26,48,.8); color: var(--text);
    font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="pauseBtn" title="ポーズ (Esc)">Ⅱ</button>

<div class="screen on" id="scTitle">
  <div class="card">
    <h1>My Rhythm</h1>
    <p class="lead">好きな曲をアップロードすると、曲を解析して譜面を自動で作ります。</p>
    <div id="drop">
      <strong>🎵 音楽ファイルを選択 / ここにドロップ</strong>
      mp3・wav・ogg・m4a・flac など
      <div id="fileName"></div>
      <div class="bar" id="bar"><i></i></div>
    </div>
    <input type="file" id="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac,.aac" hidden>
    <div class="err" id="err"></div>

    <div class="row"><span>難易度</span>
      <div class="seg" id="diff">
        <button data-v="easy">かんたん</button>
        <button data-v="normal" class="sel">ふつう</button>
        <button data-v="hard">むずかしい</button>
      </div>
    </div>
    <div class="row"><label for="speed">ノーツ速度</label>
      <input type="range" id="speed" min="1" max="10" step="1" value="5"><span class="val" id="speedV"></span></div>
    <div class="row"><label for="offset">タイミング</label>
      <input type="range" id="offset" min="-200" max="200" step="5" value="0"><span class="val" id="offsetV"></span></div>
    <div class="row"><label for="auto">オートプレイ</label>
      <input type="checkbox" id="auto"><span style="color:var(--sub)">お手本を見る</span></div>

    <button class="btn primary" id="start" disabled>曲を選んでください</button>
    <div class="hint">
      操作: <kbd>D</kbd> <kbd>F</kbd> <kbd>J</kbd> <kbd>K</kbd> で4つのレーンを叩く(スマホはレーンをタップ)／ <kbd>Esc</kbd> でポーズ<br>
      ノーツが早く/遅く感じるときは「タイミング」を調整してください(＋でノーツが遅く来ます)。<br>
      曲はブラウザの中だけで処理され、どこにも送信されません。
    </div>
  </div>
</div>

<div class="screen dim" id="scPause">
  <div class="card">
    <h2>ポーズ中</h2>
    <button class="btn primary" id="resume">再開する</button>
    <button class="btn" id="retryP">最初からやり直す</button>
    <button class="btn" id="quitP">曲選択に戻る</button>
  </div>
</div>

<div class="screen dim" id="scResult">
  <div class="card">
    <div id="resSong"></div>
    <div id="rank">S</div>
    <table>
      <tr><td>スコア</td><td id="rScore"></td></tr>
      <tr><td>精度</td><td id="rAcc"></td></tr>
      <tr><td>最大コンボ</td><td id="rCombo"></td></tr>
      <tr><td style="color:#ffe66d">PERFECT</td><td id="rP"></td></tr>
      <tr><td style="color:#4de3a4">GREAT</td><td id="rG"></td></tr>
      <tr><td style="color:#5aa9ff">GOOD</td><td id="rO"></td></tr>
      <tr><td style="color:#ff7b7b">MISS</td><td id="rM"></td></tr>
    </table>
    <button class="btn primary" id="retryR">もう一度</button>
    <button class="btn" id="quitR">曲選択に戻る</button>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* ============================================================
 *  1. 音楽解析 (スペクトラルフラックスによるオンセット検出)
 * ============================================================ */
const FFT_N = 1024, HOP = 512;
const BAND_HZ = [200, 800, 3200];          // 4帯域 → 4レーンの割り当てに使う

const fftTables = (() => {
  const n = FFT_N, rev = new Uint16Array(n), cos = new Float32Array(n / 2), sin = new Float32Array(n / 2);
  const bits = Math.log2(n);
  for (let i = 0; i < n; i++) {
    let r = 0;
    for (let b = 0; b < bits; b++) r |= ((i >> b) & 1) << (bits - 1 - b);
    rev[i] = r;
  }
  for (let i = 0; i < n / 2; i++) {
    cos[i] = Math.cos(2 * Math.PI * i / n);
    sin[i] = Math.sin(2 * Math.PI * i / n);
  }
  const win = new Float32Array(n);
  for (let i = 0; i < n; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1));
  return { rev, cos, sin, win };
})();

function fft(re, im) {
  const n = FFT_N, { rev, cos, sin } = fftTables;
  for (let i = 0; i < n; i++) {
    const j = rev[i];
    if (j > i) { const t = re[i]; re[i] = re[j]; re[j] = t; }
  }
  for (let size = 2; size <= n; size <<= 1) {
    const half = size >> 1, step = n / size;
    for (let i = 0; i < n; i += size) {
      for (let j = 0, k = 0; j < half; j++, k += step) {
        const a = i + j, b = a + half;
        const tr = re[b] * cos[k] + im[b] * sin[k];
        const ti = im[b] * cos[k] - re[b] * sin[k];
        re[b] = re[a] - tr; im[b] = im[a] - ti;
        re[a] += tr; im[a] += ti;
      }
    }
  }
}

async function extractFeatures(buffer, onProgress) {
  const sr = buffer.sampleRate, len = buffer.length;
  const mono = new Float32Array(len);
  for (let c = 0; c < buffer.numberOfChannels; c++) {
    const d = buffer.getChannelData(c);
    for (let i = 0; i < len; i++) mono[i] += d[i];
  }
  const frames = Math.floor((len - FFT_N) / HOP) + 1;
  if (frames < 10) throw new Error('曲が短すぎます');

  const half = FFT_N / 2;
  const binBand = new Uint8Array(half);
  for (let k = 0; k < half; k++) {
    const hz = k * sr / FFT_N;
    binBand[k] = hz < BAND_HZ[0] ? 0 : hz < BAND_HZ[1] ? 1 : hz < BAND_HZ[2] ? 2 : 3;
  }
  const flux = new Float32Array(frames);
  const bands = [0, 1, 2, 3].map(() => new Float32Array(frames));
  const prev = new Float32Array(half), re = new Float32Array(FFT_N), im = new Float32Array(FFT_N);
  const win = fftTables.win;
  let lastYield = performance.now();

  for (let f = 0; f < frames; f++) {
    const off = f * HOP;
    for (let i = 0; i < FFT_N; i++) { re[i] = mono[off + i] * win[i]; im[i] = 0; }
    fft(re, im);
    let sum = 0;
    for (let k = 1; k < half; k++) {
      const mag = Math.log1p(50 * Math.sqrt(re[k] * re[k] + im[k] * im[k]));
      const d = mag - prev[k];
      if (d > 0) { sum += d; bands[binBand[k]][f] += d; }
      prev[k] = mag;
    }
    flux[f] = sum;
    if ((f & 255) === 0 && performance.now() - lastYield > 30) {
      onProgress && onProgress(f / frames);
      await new Promise(r => setTimeout(r));
      lastYield = performance.now();
    }
  }
  flux[0] = 0; bands.forEach(b => b[0] = 0);   // 先頭フレームは無音からの立ち上がりなので除外
  onProgress && onProgress(1);
  return { flux, bands, frames, dt: HOP / sr, sr, duration: buffer.duration };
}

const DIFF = {
  easy:   { mult: 1.7,  gap: 0.40, dbl: 0 },
  normal: { mult: 1.45, gap: 0.21, dbl: 0.03 },
  hard:   { mult: 1.25, gap: 0.115, dbl: 0.14 },
};

function makeChart(feat, diffName) {
  const { flux, bands, frames, dt } = feat, P = DIFF[diffName];
  const ps = new Float64Array(frames + 1);
  for (let i = 0; i < frames; i++) ps[i + 1] = ps[i] + flux[i];
  const gm = ps[frames] / frames;
  const W = Math.max(4, Math.round(0.5 / dt));

  // ピーク候補
  const cands = [];
  for (let n = 2; n < frames - 2; n++) {
    const v = flux[n];
    if (v < flux[n - 1] || v <= flux[n + 1] || v < flux[n - 2] || v < flux[n + 2]) continue;
    const lo = Math.max(0, n - W), hi = Math.min(frames, n + W + 1);
    const lm = (ps[hi] - ps[lo]) / (hi - lo);
    if (v > lm * P.mult + gm * 0.15) cands.push({ n, s: v - lm });
  }
  // 強い音から優先して採用 (近すぎるノーツは間引く)
  cands.sort((a, b) => b.s - a.s);
  const g = Math.max(1, Math.round(P.gap / dt));
  const taken = new Uint8Array(frames);
  const picked = [];
  for (const c of cands) {
    if (taken[c.n]) continue;
    picked.push(c);
    const a = Math.max(0, c.n - g + 1), b = Math.min(frames, c.n + g);
    taken.fill(1, a, b);
  }
  let dblThr = Infinity;
  if (P.dbl > 0 && picked.length) dblThr = picked[Math.min(picked.length - 1, Math.floor(picked.length * P.dbl))].s;
  picked.sort((a, b) => a.n - b.n);

  // レーン割り当て: 低音→左, 高音→右。同じレーンが続きすぎないように散らす
  const bandMean = bands.map(b => { let s = 0; for (let i = 0; i < frames; i++) s += b[i]; return s / frames || 1e-9; });
  const notes = [];
  let last = -1, run = 0;
  const use = [1, 1, 1, 1];                       // 最近よく使ったレーンほど選ばれにくくする
  for (const c of picked) {
    const useSum = use[0] + use[1] + use[2] + use[3];
    const sc = bands.map((b, i) => (b[c.n - 1] + b[c.n] + b[c.n + 1]) / bandMean[i] / (0.35 + 2.6 * use[i] / useSum));
    const order = [0, 1, 2, 3].sort((x, y) => sc[y] - sc[x]);
    let lane = order[0];
    if (lane === last && run >= 2) lane = order[1];
    run = lane === last ? run + 1 : 1;
    last = lane;
    for (let i = 0; i < 4; i++) use[i] *= 0.88;
    use[lane] += 1;
    const t = (c.n * HOP + FFT_N / 2) / feat.sr + 0.002;
    notes.push({ t, lane });
    if (c.s >= dblThr) notes.push({ t, lane: order[0] === lane ? order[1] : order[0] });
  }
  return notes;
}

/* ============================================================
 *  2. 画面まわり
 * ============================================================ */
const cv = $('cv'), g2 = cv.getContext('2d');
let CW = 0, CH = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  CW = window.innerWidth; CH = window.innerHeight;
  cv.width = Math.round(CW * dpr); cv.height = Math.round(CH * dpr);
  g2.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize); resize();

const screens = ['scTitle', 'scPause', 'scResult'];
function show(id) {
  screens.forEach(s => $(s).classList.toggle('on', s === id));
  $('pauseBtn').style.display = id === null ? 'block' : 'none';
}

const settings = Object.assign({ diff: 'normal', speed: 5, offset: 0, auto: false },
  JSON.parse(localStorage.getItem('myrhythm') || '{}'));
function saveSettings() { localStorage.setItem('myrhythm', JSON.stringify(settings)); }
function syncSettingsUI() {
  document.querySelectorAll('#diff button').forEach(b => b.classList.toggle('sel', b.dataset.v === settings.diff));
  $('speed').value = settings.speed; $('speedV').textContent = settings.speed;
  $('offset').value = settings.offset; $('offsetV').textContent = (settings.offset > 0 ? '+' : '') + settings.offset + ' ms';
  $('auto').checked = settings.auto;
}
$('diff').addEventListener('click', e => {
  if (e.target.dataset.v) { settings.diff = e.target.dataset.v; saveSettings(); syncSettingsUI(); updateStartBtn(); }
});
$('speed').addEventListener('input', e => { settings.speed = +e.target.value; saveSettings(); syncSettingsUI(); });
$('offset').addEventListener('input', e => { settings.offset = +e.target.value; saveSettings(); syncSettingsUI(); });
$('auto').addEventListener('change', e => { settings.auto = e.target.checked; saveSettings(); });
syncSettingsUI();

/* ============================================================
 *  3. ファイル読み込み
 * ============================================================ */
let actx = null, analyser = null, specData = null;
let song = null;       // { name, buffer, feat }
let loadToken = 0;

function ensureCtx() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = actx.createAnalyser();
    analyser.fftSize = 128; analyser.smoothingTimeConstant = 0.8;
    analyser.connect(actx.destination);
    specData = new Uint8Array(analyser.frequencyBinCount);
  }
  return actx;
}

function setProgress(p) {
  $('bar').style.display = p === null ? 'none' : 'block';
  if (p !== null) $('bar').firstElementChild.style.width = (p * 100).toFixed(1) + '%';
}

function updateStartBtn() {
  const b = $('start');
  if (!song) { b.disabled = true; if (!b.dataset.busy) b.textContent = '曲を選んでください'; return; }
  const n = makeChart(song.feat, settings.diff).length;
  b.disabled = n === 0;
  b.textContent = n ? `スタート (${n} ノーツ)` : 'ノーツを検出できませんでした';
}

async function loadBuffer(buffer, name) {
  const token = ++loadToken;
  song = null;
  $('err').textContent = '';
  $('fileName').textContent = name + ' を解析中…';
  $('start').dataset.busy = '1'; $('start').disabled = true; $('start').textContent = '解析中…';
  setProgress(0);
  try {
    const feat = await extractFeatures(buffer, p => { if (token === loadToken) setProgress(p); });
    if (token !== loadToken) return;
    song = { name, buffer, feat };
    const m = Math.floor(buffer.duration / 60), s = Math.floor(buffer.duration % 60);
    $('fileName').textContent = `${name} (${m}:${String(s).padStart(2, '0')})`;
  } catch (e) {
    if (token !== loadToken) return;
    $('fileName').textContent = '';
    $('err').textContent = '解析に失敗しました: ' + e.message;
  } finally {
    if (token === loadToken) { setProgress(null); delete $('start').dataset.busy; updateStartBtn(); }
  }
}

async function loadFile(file) {
  if (!file) return;
  $('err').textContent = '';
  $('fileName').textContent = file.name + ' を読み込み中…';
  let buffer;
  try {
    buffer = await ensureCtx().decodeAudioData(await file.arrayBuffer());
  } catch (e) {
    $('fileName').textContent = '';
    $('err').textContent = 'この形式のファイルは再生できませんでした。mp3 / wav / ogg / m4a などを試してください。';
    return;
  }
  await loadBuffer(buffer, file.name);
}

const drop = $('drop');
drop.addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
window.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
window.addEventListener('dragleave', () => drop.classList.remove('over'));
window.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  if ($('scTitle').classList.contains('on')) loadFile(e.dataTransfer.files[0]);
});

/* ============================================================
 *  4. ゲーム本体
 * ============================================================ */
const LANES = 4, KEYS = ['KeyD', 'KeyF', 'KeyJ', 'KeyK'], KEY_LABEL = ['D', 'F', 'J', 'K'];
const COLORS = ['#ff5d8f', '#ffc145', '#4de3a4', '#5aa9ff'];
const WIN = { perfect: 0.05, great: 0.1, good: 0.16 };
const JUDGE = {
  perfect: { label: 'PERFECT', color: '#ffe66d', w: 1 },
  great:   { label: 'GREAT',   color: '#4de3a4', w: 0.7 },
  good:    { label: 'GOOD',    color: '#5aa9ff', w: 0.3 },
  miss:    { label: 'MISS',    color: '#ff7b7b', w: 0 },
};
const LEAD_IN = 2.0;

let game = null;   // 進行中のゲーム状態

function startGame() {
  if (!song) return;
  stopGame();
  const ctx = ensureCtx();
  ctx.resume();
  const notes = makeChart(song.feat, settings.diff).map(n => ({ t: n.t, lane: n.lane, done: false }));
  const lanes = Array.from({ length: LANES }, () => []);
  notes.forEach(n => lanes[n.lane].push(n));
  const src = ctx.createBufferSource();
  src.buffer = song.buffer;
  src.connect(analyser);
  const startAt = ctx.currentTime + LEAD_IN;
  src.start(startAt);
  game = {
    src, startAt, notes, lanes, head: [0, 0, 0, 0], drawFrom: 0,
    travel: 2.2 / (0.6 + settings.speed * 0.28),     // ノーツが画面を落ちてくる秒数
    offset: settings.offset / 1000, auto: settings.auto,
    score: 0, combo: 0, maxCombo: 0, accSum: 0, judged: 0,
    counts: { perfect: 0, great: 0, good: 0, miss: 0 },
    held: [false, false, false, false], flash: [0, 0, 0, 0],
    fx: [], lastJudge: null, paused: false, finished: false,
    duration: song.buffer.duration,
  };
  show(null);
}

function stopGame() {
  if (!game) return;
  try { game.src.stop(); } catch (e) {}
  game.src.disconnect();
  game = null;
}

function songTime() {
  const lat = (actx.outputLatency || actx.baseLatency || 0);
  return actx.currentTime - game.startAt - lat - game.offset;
}

function applyJudge(note, kind, now) {
  const G = game, J = JUDGE[kind];
  note.done = true;
  G.counts[kind]++; G.judged++; G.accSum += J.w;
  if (kind === 'miss') G.combo = 0;
  else {
    G.combo++; if (G.combo > G.maxCombo) G.maxCombo = G.combo;
    G.score += Math.round(1000 * J.w * (1 + Math.min(G.combo, 100) / 200));
    G.fx.push({ lane: note.lane, t: performance.now(), color: J.color });
  }
  G.lastJudge = { kind, t: performance.now() };
}

function hitLane(lane) {
  const G = game;
  if (!G || G.paused || G.finished || G.auto) return;
  G.flash[lane] = performance.now();
  const now = songTime(), arr = G.lanes[lane];
  let i = G.head[lane];
  while (i < arr.length && arr[i].done) i++;
  G.head[lane] = i;
  if (i >= arr.length) return;
  const d = Math.abs(arr[i].t - now);
  if (d > WIN.good) return;                      // まだ遠い → 空打ち
  applyJudge(arr[i], d <= WIN.perfect ? 'perfect' : d <= WIN.great ? 'great' : 'good', now);
}

function update(now) {
  const G = game;
  for (let l = 0; l < LANES; l++) {
    const arr = G.lanes[l];
    let i = G.head[l];
    while (i < arr.length) {
      const n = arr[i];
      if (n.done) { i++; continue; }
      if (G.auto && n.t <= now) { G.flash[l] = performance.now(); applyJudge(n, 'perfect', now); i++; continue; }
      if (n.t < now - WIN.good) { applyJudge(n, 'miss', now); i++; continue; }
      break;
    }
    G.head[l] = i;
  }
  if (!G.finished && now > G.duration + 0.8) finishGame();
}

function finishGame() {
  const G = game;
  G.finished = true;
  const total = G.notes.length || 1, acc = G.accSum / total * 100;
  const full = G.counts.miss === 0;
  const rank = acc >= 95 ? 'S' : acc >= 88 ? 'A' : acc >= 75 ? 'B' : acc >= 60 ? 'C' : 'D';
  const rc = { S: '#ffe66d', A: '#4de3a4', B: '#5aa9ff', C: '#c9a0ff', D: '#ff7b7b' }[rank];
  $('rank').textContent = rank; $('rank').style.color = rc;
  $('resSong').textContent = song.name + (G.auto ? '(オートプレイ)' : '') + (full ? ' ★FULL COMBO' : '');
  $('rScore').textContent = G.score.toLocaleString();
  $('rAcc').textContent = acc.toFixed(2) + ' %';
  $('rCombo').textContent = G.maxCombo + ' / ' + G.notes.length;
  $('rP').textContent = G.counts.perfect; $('rG').textContent = G.counts.great;
  $('rO').textContent = G.counts.good; $('rM').textContent = G.counts.miss;
  show('scResult');
}

function setPaused(p) {
  if (!game || game.finished || game.paused === p) return;
  game.paused = p;
  if (p) { actx.suspend(); show('scPause'); } else { actx.resume(); show(null); }
}
function quitToTitle() { stopGame(); if (actx) actx.resume(); show('scTitle'); }

/* ---- 入力 ---- */
window.addEventListener('keydown', e => {
  if (e.code === 'Escape' && game && !game.finished) { setPaused(!game.paused); return; }
  const lane = KEYS.indexOf(e.code);
  if (lane < 0 || e.repeat || !game) return;
  e.preventDefault();
  game.held[lane] = true;
  hitLane(lane);
});
window.addEventListener('keyup', e => {
  const lane = KEYS.indexOf(e.code);
  if (lane >= 0 && game) game.held[lane] = false;
});
cv.addEventListener('pointerdown', e => {
  if (!game) return;
  const L = layout();
  const lane = Math.floor((e.clientX - L.x) / L.lw);
  if (lane >= 0 && lane < LANES) hitLane(lane);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
$('pauseBtn').onclick = () => setPaused(true);
$('resume').onclick = () => setPaused(false);
$('retryP').onclick = $('retryR').onclick = () => { actx.resume(); startGame(); };
$('quitP').onclick = $('quitR').onclick = quitToTitle;
$('start').onclick = startGame;

/* ============================================================
 *  5. 描画
 * ============================================================ */
function layout() {
  const w = Math.min(520, CW * 0.96), x = (CW - w) / 2;
  return { x, w, lw: w / LANES, jy: CH - Math.max(90, CH * 0.16) };
}

function rr(x, y, w, h, r) {
  g2.beginPath();
  g2.moveTo(x + r, y); g2.arcTo(x + w, y, x + w, y + h, r); g2.arcTo(x + w, y + h, x, y + h, r);
  g2.arcTo(x, y + h, x, y, r); g2.arcTo(x, y, x + w, y, r); g2.closePath();
}

function draw() {
  requestAnimationFrame(draw);
  g2.clearRect(0, 0, CW, CH);
  const pnow = performance.now();

  // 背景スペクトラム
  if (analyser) {
    analyser.getByteFrequencyData(specData);
    const n = 40, bw = CW / n;
    for (let i = 0; i < n; i++) {
      const h = specData[i] / 255 * CH * 0.45;
      g2.fillStyle = `hsla(${220 + i * 3}, 80%, 60%, 0.10)`;
      g2.fillRect(i * bw + 1, CH - h, bw - 2, h);
    }
  }
  if (!game) return;
  const G = game, L = layout();
  const now = songTime();
  if (!G.paused && !G.finished) update(now);

  // レーン
  g2.fillStyle = 'rgba(14,17,34,0.88)';
  g2.fillRect(L.x, 0, L.w, CH);
  for (let l = 0; l < LANES; l++) {
    const x = L.x + l * L.lw;
    const fl = Math.max(G.held[l] ? 0.6 : 0, 1 - (pnow - G.flash[l]) / 180);
    if (fl > 0) {
      const gr = g2.createLinearGradient(0, L.jy - 320, 0, L.jy);
      gr.addColorStop(0, 'transparent'); gr.addColorStop(1, COLORS[l]);
      g2.globalAlpha = fl * 0.35; g2.fillStyle = gr;
      g2.fillRect(x, L.jy - 320, L.lw, 320); g2.globalAlpha = 1;
    }
    g2.strokeStyle = '#2a3055'; g2.lineWidth = 1;
    g2.beginPath(); g2.moveTo(x + .5, 0); g2.lineTo(x + .5, CH); g2.stroke();
  }
  g2.beginPath(); g2.moveTo(L.x + L.w - .5, 0); g2.lineTo(L.x + L.w - .5, CH); g2.stroke();

  // 判定ライン & キー表示
  g2.fillStyle = '#e8ebff'; g2.fillRect(L.x, L.jy - 2, L.w, 4);
  g2.font = '600 18px "Segoe UI", sans-serif'; g2.textAlign = 'center'; g2.textBaseline = 'middle';
  for (let l = 0; l < LANES; l++) {
    const cx = L.x + (l + .5) * L.lw, cy = L.jy + (CH - L.jy) / 2;
    g2.globalAlpha = G.held[l] ? 1 : 0.55;
    g2.strokeStyle = COLORS[l]; g2.lineWidth = 2;
    rr(cx - 22, cy - 22, 44, 44, 10); g2.stroke();
    if (G.held[l]) { g2.fillStyle = COLORS[l] + '55'; g2.fill(); }
    g2.fillStyle = '#e8ebff'; g2.fillText(KEY_LABEL[l], cx, cy + 1);
  }
  g2.globalAlpha = 1;

  // ノーツ
  const nh = 22, pad = 6;
  while (G.drawFrom < G.notes.length && (G.notes[G.drawFrom].done || G.notes[G.drawFrom].t < now - 0.3)) {
    if (!G.notes[G.drawFrom].done) break;
    G.drawFrom++;
  }
  for (let i = G.drawFrom; i < G.notes.length; i++) {
    const n = G.notes[i];
    if (n.t - now > G.travel) break;
    if (n.done) continue;
    const y = L.jy - (n.t - now) / G.travel * L.jy;
    const x = L.x + n.lane * L.lw + pad;
    g2.shadowColor = COLORS[n.lane]; g2.shadowBlur = 14;
    g2.fillStyle = COLORS[n.lane];
    rr(x, y - nh / 2, L.lw - pad * 2, nh, 8); g2.fill();
    g2.shadowBlur = 0;
    g2.fillStyle = 'rgba(255,255,255,.55)';
    rr(x + 6, y - nh / 2 + 4, L.lw - pad * 2 - 12, 4, 2); g2.fill();
  }

  // ヒットエフェクト
  G.fx = G.fx.filter(f => pnow - f.t < 300);
  for (const f of G.fx) {
    const p = (pnow - f.t) / 300, cx = L.x + (f.lane + .5) * L.lw;
    g2.globalAlpha = 1 - p; g2.strokeStyle = f.color; g2.lineWidth = 4 * (1 - p) + 1;
    g2.beginPath(); g2.ellipse(cx, L.jy, L.lw * (0.25 + p * 0.45), 14 + p * 26, 0, 0, Math.PI * 2); g2.stroke();
  }
  g2.globalAlpha = 1;

  // 判定文字・コンボ
  const cx = L.x + L.w / 2;
  if (G.lastJudge && pnow - G.lastJudge.t < 500) {
    const p = (pnow - G.lastJudge.t) / 500, J = JUDGE[G.lastJudge.kind];
    g2.globalAlpha = 1 - p * p;
    g2.font = `800 ${30 + (1 - Math.min(1, p * 5)) * 8}px "Segoe UI", sans-serif`;
    g2.fillStyle = J.color; g2.fillText(J.label, cx, L.jy - 130 - p * 10);
    g2.globalAlpha = 1;
  }
  if (G.combo >= 2) {
    g2.fillStyle = 'rgba(232,235,255,.9)';
    g2.font = '800 56px "Segoe UI", sans-serif'; g2.fillText(G.combo, cx, CH * 0.30);
    g2.font = '600 14px "Segoe UI", sans-serif'; g2.fillStyle = '#8f97c4'; g2.fillText('COMBO', cx, CH * 0.30 + 40);
  }
  if (now < 0 && !G.finished) {
    g2.fillStyle = '#e8ebff'; g2.font = '800 72px "Segoe UI", sans-serif';
    g2.fillText(Math.ceil(-now), cx, CH * 0.45);
  }

  // スコア・進行バー
  g2.textAlign = 'left'; g2.font = '700 22px "Segoe UI", sans-serif'; g2.fillStyle = '#e8ebff';
  g2.fillText(G.score.toLocaleString(), 16, 30);
  g2.font = '13px "Segoe UI", sans-serif'; g2.fillStyle = '#8f97c4';
  const acc = G.judged ? (G.accSum / G.judged * 100).toFixed(1) + '%' : '--';
  g2.fillText(`精度 ${acc}${G.auto ? '  AUTO' : ''}`, 16, 54);
  g2.fillStyle = '#2a3055'; g2.fillRect(0, 0, CW, 4);
  g2.fillStyle = '#6cf'; g2.fillRect(0, 0, CW * Math.min(1, Math.max(0, now / G.duration)), 4);
}
requestAnimationFrame(draw);

// 動作テスト用
window.rhythm = { extractFeatures, makeChart, loadBuffer, ensureCtx, get game() { return game; }, get song() { return song; } };
</script>
